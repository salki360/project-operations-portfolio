<rect width="1200" height="360" rx="18" fill="#F2F6F8"/><text x="48" y="56" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#0D8B8B">DELIVERY CONTROL LOOP</text><text x="48" y="94" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">A clear path from kickoff to handover</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#123047"><rect x="48" y="145" width="188" height="110" rx="16"/><rect x="278" y="145" width="188" height="110" rx="16"/><rect x="508" y="145" width="188" height="110" rx="16"/><rect x="738" y="145" width="188" height="110" rx="16"/><rect x="968" y="145" width="188" height="110" rx="16"/></g><g fill="#8BE1C8" font-size="13" font-weight="700"><text x="142" y="178">01 · ALIGN</text><text x="372" y="178">02 · PLAN</text><text x="602" y="178">03 · DELIVER</text><text x="832" y="178">04 · CONTROL</text><text x="1062" y="178">05 · CLOSE</text></g><g fill="#FFFFFF" font-size="17"><text x="142" y="211">Scope &amp; outcomes</text><text x="372" y="211">Owners &amp; dates</text><text x="602" y="211">Build &amp; validate</text><text x="832" y="211">Status &amp; risks</text><text x="1062" y="211">UAT &amp; handover</text></g></g><g stroke="#39C6B3" stroke-width="4" fill="none"><path d="M238 200h31"/><path d="M468 200h31"/><path d="M698 200h31"/><path d="M928 200h31"/></g><text x="600" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#637381">AI may help draft and flag • Coordinator verifies facts, decisions and dates</text></svg>